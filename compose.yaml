name: university-demo
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DEMO_DB_PASSWORD}
    ports: ["127.0.0.1:14335:1433"]
    volumes: ["university-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: ./server
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: Server=db;Database=UNIVERSITY_DEMO;User Id=sa;Password=${DEMO_DB_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Database__CreateIfMissing: "true"
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:5092:8080"]
  web:
    build: ./web
    depends_on: [api]
    ports: ["127.0.0.1:5182:80"]
volumes:
  university-data:

